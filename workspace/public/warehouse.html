<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>仓库端 · 电子仓单平台</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="topbar"></div>
<main>
  <div class="grid cols-3" id="stats"></div>

  <div class="grid cols-2" style="margin-top:16px">
    <div class="card">
      <h2>📥 按库位 + 检验批登记仓单</h2>
      <div class="form-row">
        <label class="fld">库位
          <select id="f-loc"></select>
        </label>
        <label class="fld">检验品级
          <select id="f-grade"></select>
        </label>
        <label class="fld">货主
          <select id="f-holder"></select>
        </label>
        <label class="fld">数量(吨)
          <input id="f-qty" type="number" step="0.001" placeholder="如 800">
        </label>
        <label class="fld">起始区间(可选,留空自动分配)
          <input id="f-start" type="number" step="0.001" placeholder="自动">
        </label>
        <button class="primary" id="btn-register">登记仓单</button>
      </div>
      <p class="small muted" style="margin-top:8px">系统自动生成检验批,并在提交前校验该库位 <span class="interval">[start,end)</span> 物理区间与其他有效仓单不重叠。</p>
    </div>

    <div class="card">
      <h2>🔗 合并仓单</h2>
      <div id="merge-sel" class="pill-row small muted">尚未选择仓单(在下方列表点「加入合并」)</div>
      <div class="hr"></div>
      <div class="row-actions">
        <button class="primary" id="btn-merge">合并所选</button>
        <button id="btn-merge-clear">清空选择</button>
      </div>
      <p class="small muted" style="margin-top:8px">仅允许<b>同库位、同品级、同货主、区间首尾相邻</b>且无有效质押的仓单合并。</p>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <h2>📋 仓单台账 <span class="small muted" style="font-weight:400">— 区间 / 版本 / 质押状态一览</span>
      <span style="flex:1"></span>
      <button id="btn-refresh">刷新</button>
      <button class="danger" id="btn-reset">重置演示数据</button>
    </h2>
    <div class="table-wrap">
      <table id="tbl-receipts">
        <thead>
          <tr>
            <th>仓单号</th><th>库位</th><th>品级</th><th>货主</th>
            <th>物理区间(吨)</th><th>版本</th><th>状态</th><th>最新市值</th>
            <th>质押状态</th><th style="min-width:290px">操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="grid cols-2" style="margin-top:16px">
    <div class="card">
      <h2>🧪 检验批记录(含复检)</h2>
      <div class="table-wrap" style="max-height:300px">
        <table id="tbl-ib"><thead><tr><th>检验批</th><th>类型</th><th>仓单</th><th>品级</th><th>数量</th><th>时间</th></tr></thead><tbody></tbody></table>
      </div>
    </div>
    <div class="card">
      <h2>🚚 出库记录与放行单</h2>
      <div class="table-wrap" style="max-height:300px">
        <table id="tbl-dl"><thead><tr><th>出库单</th><th>仓单</th><th>数量</th><th>放行单</th><th>时间</th></tr></thead><tbody></tbody></table>
      </div>
      <h3>当前有效放行单</h3>
      <div class="table-wrap" style="max-height:200px">
        <table id="tbl-rl"><thead><tr><th>放行单</th><th>仓单</th><th>质权人</th><th>数量</th><th>令牌</th></tr></thead><tbody></tbody></table>
      </div>
    </div>
  </div>
</main>
<script src="/common.js"></script>
<script src="/warehouse.js"></script>
</body>
</html>
